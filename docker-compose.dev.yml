# Dev with hot reload: docker compose -f docker-compose.dev.yml up
# Prod stays: docker compose up (separate file, they can't run at once — same ports)
services:
  api-dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    command: dotnet watch run --no-launch-profile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5080:8080"
    volumes:
      - ./RangerCats.Api:/src
      - /src/bin # overlay Windows-built bin/obj — Linux builds stay inside container
      - /src/obj

  web-dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "8080:5173"
    volumes:
      - ./RangerCats.Web:/app
      - /app/node_modules # container's Linux node_modules, don't get shadowed by host mount
